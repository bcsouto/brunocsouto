name: r29-rdc-978-vigencia-sem-relatorio
expected_outcome: |
  A primeira linha informa que o relatório citado não foi fornecido e que a resposta trata apenas do ato. A conclusão aplica o protocolo AnvisaLegis completo: RDC nº 978/2025 vigente com alterações; "ver mais detalhes" do ato principal e dos alteradores RDC nº 986/2025 e RDC nº 1.043/2026; assinatura e publicação no DOU registradas separadamente; republicação da RDC nº 1.043/2026 tratada como pendência de início de vigência; recomendação separada dos fatos. Referência congelada da consulta de 26/11/2026: RDC 978 assinada em 06/06/2025 e publicada no DOU nº 108 de 10/06/2025; RDC 986 assinada em 15/08/2025 e publicada no DOU nº 156 de 19/08/2025; RDC 1.043 assinada em 01/10/2026, publicada no DOU nº 188 de 05/10/2026 e republicada no DOU nº 195 de 15/10/2026; os dois alteradores constam como vigentes; RDC 786/2023 revogada pela RDC 978. Em execução posterior, situações diferentes encontradas no AnvisaLegis prevalecem sobre esta referência, desde que a resposta cite a consulta.
